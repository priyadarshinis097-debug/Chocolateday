<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Surprise 🍫💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  height:100vh;
  overflow:hidden;
  background: radial-gradient(circle at center, #2c1a00,#3e2a00,#1c0f00);
  position:relative;
}

/* Full screen animation elements */
.heart, .petal, .chocolate, .confetti{
  position:absolute;
  pointer-events:none;
  z-index:1;
}

/* Hearts */
.heart{
  font-size:24px;
  color:#FFD699;
  text-shadow:0 0 8px #FFC966,0 0 12px #FFD966;
  animation:fall linear infinite;
}

/* Petals */
.petal{
  font-size:28px;
  animation:fall linear infinite;
}

/* Chocolates */
.chocolate{
  font-size:22px;
  animation:fall linear infinite;
}

/* Confetti */
.confetti{
  width:10px;
  height:10px;
  border-radius:50%;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(100vh) rotate(360deg);}
}

/* Popup messages */
.popup{
  position:absolute;
  font-size:20px;
  font-weight:bold;
  color:#FFD699;
  text-shadow:0 0 10px #5C2F00;
  animation: floatUp 1.5s ease forwards;
  pointer-events:none;
  z-index:999;
}

@keyframes floatUp{
  0%{opacity:0; transform:translateY(20px) scale(.5);} 
  50%{opacity:1;}
  100%{opacity:0; transform:translateY(-60px) scale(1.2);} 
}

/* Center card */
.card{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding:40px 30px;
  border-radius:25px;
  text-align:center;
  color:white;
  max-width:400px;
  z-index:999;
}

.card h1{
  font-size:32px;
  color:#FFD699;
  margin-bottom:15px;
}

.card p{
  font-size:18px;
  margin-bottom:20px;
}

#openBtn{
  padding:12px 25px;
  background:#A0522D;
  border:none;
  border-radius:20px;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

#openBtn:hover{
  background:#8B4513;
  transform:scale(1.1);
}
</style>
</head>
<body>

<!-- Sweet Music -->
<audio id="music" loop autoplay muted oncanplay="this.muted=false">
  <source src="https://www.bensound.com/bensound-music/bensound-sunny.mp3" type="audio/mpeg">
</audio>

<!-- Center Card -->
<div class="card">
  <h1>Chocolate Surprise 🍫</h1>
  <p>Click anywhere to see your sweet messages 💖</p>
  <button id="openBtn">Open Chocolate 🍫</button>
</div>

<script>
const body = document.body;
const openBtn = document.getElementById("openBtn");
const messages = [
  "You're my sweetest treat ❤️",
  "Chocolate + You = Perfect 🍫",
  "Life is sweeter with you 💖",
  "You melt my heart 💘",
  "Sweet like cocoa, love like you 💞",
  "Every day with you is chocolatey sweet 🍬"
];

// Play music on click (fallback)
document.body.addEventListener("click", ()=>{
  document.getElementById("music").play().catch(()=>{});
});

// Animations
function createHeart(){
  const heart = document.createElement("div");
  heart.className="heart";
  heart.innerText="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=18+Math.random()*20+"px";
  heart.style.animationDuration=3+Math.random()*4+"s";
  body.appendChild(heart);
  setTimeout(()=>heart.remove(),7000);
}

function createPetal(){
  const petal = document.createElement("div");
  petal.className="petal";
  petal.innerText="🌹";
  petal.style.left=Math.random()*100+"vw";
  petal.style.opacity=0.5+Math.random()*0.5;
  petal.style.animationDuration=4+Math.random()*4+"s";
  body.appendChild(petal);
  setTimeout(()=>petal.remove(),9000);
}

function createChocolate(){
  const choco = document.createElement("div");
  choco.className="chocolate";
  const chocos = ["🍫","🍬","🍪"];
  choco.innerText=chocos[Math.floor(Math.random()*chocos.length)];
  choco.style.left=Math.random()*100+"vw";
  choco.style.fontSize=18+Math.random()*20+"px";
  choco.style.animationDuration=3+Math.random()*5+"s";
  body.appendChild(choco);
  setTimeout(()=>choco.remove(),7000);
}

function createConfetti(){
  const conf = document.createElement("div");
  conf.className="confetti";
  conf.style.left=Math.random()*100+"vw";
  conf.style.background=["#FFD966","#FFC966","#FFA500"][Math.floor(Math.random()*3)];
  conf.style.animationDuration=2+Math.random()*3+"s";
  body.appendChild(conf);
  setTimeout(()=>conf.remove(),8000);
}

// Continuous animation
setInterval(createHeart, 200);
setInterval(createPetal, 300);
setInterval(createChocolate, 250);
setInterval(createConfetti, 150);

// Click anywhere → popup message
body.addEventListener("click",(e)=>{
  const msg = document.createElement("div");
  msg.className="popup";
  msg.innerText = messages[Math.floor(Math.random()*messages.length)];
  msg.style.left = e.clientX + "px";
  msg.style.top = e.clientY + "px";
  body.appendChild(msg);
  setTimeout(()=>msg.remove(),1500);
});

// Optional button click
openBtn.addEventListener("click",(e)=>{
  const msg = document.createElement("div");
  msg.className="popup";
  msg.innerText = messages[Math.floor(Math.random()*messages.length)];
  msg.style.left = e.clientX + "px";
  msg.style.top = e.clientY + "px";
  body.appendChild(msg);
  setTimeout(()=>msg.remove(),1500);
});
</script>
</body>
</html>
